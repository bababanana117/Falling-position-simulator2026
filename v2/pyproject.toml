[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: needs the built database or the six-hourly cache"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["jpduck", "windclim"]
