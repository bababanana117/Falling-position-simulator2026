name: Build and deploy to Cloudflare

# main への push で、テスト → ビルド → ドキュメント → Cloudflare Workers（静的配信）へ公開する。
# 公開先は frontend/wrangler.jsonc の custom domain（https://cusf2026.ddd3h.com）。
# 必要なリポジトリの secrets: CLOUDFLARE_API_TOKEN（Workers の編集権限）, CLOUDFLARE_ACCOUNT_ID

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "deploy"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Test
        working-directory: frontend
        run: npm run test -- --run
      - name: Build
        working-directory: frontend
        run: npm run build
        env:
          # 統計モード（7 日より先）が呼ぶバックエンド
          VITE_API_BASE: https://api.cusf2026.ddd3h.com
      - name: Build Sphinx docs (optional)
        continue-on-error: true
        run: |
          pip install -r docs/requirements.txt
          python -m sphinx -b html docs/source frontend/dist/docs
      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: frontend
          command: deploy
