# 既存の nginx から、Docker の api コンテナ（127.0.0.1:8080）へ転送する。
#   sudo cp nginx/api.cusf2026.ddd3h.com.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/api.cusf2026.ddd3h.com.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d api.cusf2026.ddd3h.com   # 443 番の設定と証明書を certbot が足す
# BFPS_HOST_PORT を変えたときは proxy_pass のポートも合わせる。
server {
    listen 80;
    listen [::]:80;
    server_name api.cusf2026.ddd3h.com;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
