# バックエンド（FastAPI）を起動する。統計風 DuckDB は /srv/clim/ に置く。
#
# 既定（docker compose up -d --build）: api だけを起動し、127.0.0.1:8080 で待つ。
#   80/443 番を使っている nginx などから転送する（nginx/api.cusf2026.ddd3h.com.conf）。
#   ホスト側のポートは BFPS_HOST_PORT で変えられる（例: BFPS_HOST_PORT=18080）。
#
# 80/443 番が空いているサーバー（docker compose --profile caddy up -d --build）:
#   Caddy も起動し、Let's Encrypt の証明書を自動で取って HTTPS を受ける（Caddyfile）。
services:
  api:
    build: .
    restart: unless-stopped
    environment:
      BFPS_CLIMATOLOGY_DB: /data/jra3q_japan_wind_2016-2025_v2.duckdb
    volumes:
      - /srv/clim:/data:ro
    ports:
      # 127.0.0.1 に限るので、外から直接はつながらない
      - "127.0.0.1:${BFPS_HOST_PORT:-8080}:8080"
  caddy:
    image: caddy:2
    profiles: ["caddy"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
volumes:
  caddy_data:
  caddy_config:
