[project]
name = "bfps"
version = "0.1.0"
description = "WASA BFPS backend - balloon trajectory simulation, Monte Carlo, optimization"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "numpy>=2.0",
    "scipy>=1.14",
    "httpx>=0.27",
    "joblib>=1.4",
    "duckdb>=1.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
markers = ["network: tests hitting external APIs (excluded by default)"]
addopts = "-m 'not network'"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bfps"]
